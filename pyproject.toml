[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neoropfm"
version = "0.1.0"
description = "NeoROP-FM: development-aware retinal foundation model for ROP (Version A experiments)"
requires-python = ">=3.10"
# 依赖不在此安装(服务器 base 环境已满足,见 environment.yml)

[tool.setuptools.packages.find]
where = ["src"]
