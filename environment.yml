# NeoROP-FM 实验环境(以服务器实际已验证版本为准)
# 本文件用于记录与复现;服务器当前 anaconda3 base 环境已满足,无需重建。
name: neoropfm
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.14
  - pip
  - pip:
      - torch==2.13.0+cu126        # 实测 2.13.0+cu126
      - torchvision==0.28.0+cu126
      - timm==1.0.22
      - scikit-learn==1.9.0
      - pandas==3.0.3
      - numpy==2.4.6
      - pyyaml==6.0.3
      - openpyxl==3.1.5
      - scipy==1.18.0
      - pillow==12.3.0
      - matplotlib==3.11.0
      - seaborn==0.13.2
      # 可选(GPU 训练阶段按需):
      # - peft                 # LoRA(若走 HF peft 路线)
      # - einops               # dinov2 官方训练代码依赖
