# LODO 线性探针 — 使用 yesterday 缓存特征(yesterday 协议验证 / 快速 E1 复现)
# 冻结特征提取(E1 新模型)见 experiments/e1_benchmark.sh → extract_features.py
models: [efficientnet_b0, convnext_tiny, dinov2_vits14, retfound_mae_cfp]

feature_source: cache              # cache = yesterday 缓存; extract = 本仓库 outputs/features
cache_dir: outputs/benchmark_cache   # reference baseline cache; override with NEOROPFM_BENCHMARK_CACHE or place files here
extract_dir: outputs/features
splits_dir: data/manifests/splits
output_dir: outputs/probes

lr:
  class_weight: balanced
  C: 1.0
  max_iter: 5000

seed: 0
